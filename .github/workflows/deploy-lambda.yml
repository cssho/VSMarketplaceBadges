name: Deploy Lambda

on:
  push:
    branches: [master]

    # 成果物に入らないファイルだけの変更ではデプロイしない。ドキュメントを直しただけで
    # バージョン発行・エイリアス付け替え・CloudFront 無効化まで走るのは無駄。
    #
    # コードとドキュメントを同時に変更した場合は、対象外のファイルが 1 つでも含まれるので
    # 通常どおり実行される (paths-ignore は「全ファイルが一致したときだけ skip」)。
    #
    # wwwroot/** は除外しない。index.html や unavailable バッジは ZIP に同梱され、
    # 変更にはデプロイが必要。
    #
    # terraform/** も除外しない。Lambda の runtime を変えたときのように、インフラの変更に
    # コードの再デプロイが必要な場合があるため (.tf だけの変更で無駄に 1 回走るのは許容する)。
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - .gitignore
      - .editorconfig
      - .vscode/**
      - .github/dependabot.yml
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  FUNCTION_NAME: vsmarketplace-badges
  ALIAS_NAME: live

# OIDC トークンの発行に必須。これが無いと configure-aws-credentials が
# ロールを引き受けられない。
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # ソリューションを明示する。テストプロジェクトのないディレクトリで素の dotnet test を
      # 実行すると、何も復元せず何も実行せずに exit 0 する = 黙って緑になるゲートになるため。
      - name: Test
        run: dotnet test VSMarketplaceBadges.sln --configuration Release

      # リポジトリルートに .sln と .csproj が両方あるので、プロジェクトの明示が必須。
      # 省略すると MSBuild が曖昧さでエラーになる。
      - name: Publish
        run: dotnet publish VSMarketplaceBadges.csproj -c Release -o ./publish

      - name: Package
        run: cd publish && zip -r ../lambda.zip . -x '*.pdb'

      # 長期のアクセスキーは使わない。実行ごとに発行される短命の OIDC トークンで
      # Terraform が作ったデプロイ用ロールを引き受ける。ロールの信頼ポリシーは
      # このリポジトリの master ref に限定してある (terraform/github-oidc.tf)。
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update function code
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://lambda.zip \
            --no-cli-pager
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      # SnapStart は $LATEST では働かない。バージョンを発行した時点で Init が走り
      # スナップショットが取られるので、公開経路は必ずエイリアス越しにする。
      #
      # SnapStart 有効時、publish-version は State=Pending のまますぐ返り、スナップショット
      # 作成は数分かかる非同期処理になる。待たずにエイリアスを付け替えると、その間の呼び出しが
      # SnapStartNotReadyException (5xx) になる窓ができるため、必ず Active を待つ。
      - name: Publish version
        id: publish
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name "$FUNCTION_NAME" \
            --query Version --output text --no-cli-pager)
          echo "Published version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          aws lambda wait published-version-active \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$VERSION"

      - name: Shift alias
        run: |
          aws lambda update-alias \
            --function-name "$FUNCTION_NAME" \
            --name "$ALIAS_NAME" \
            --function-version "${{ steps.publish.outputs.version }}" \
            --no-cli-pager

      # 古いバージョンを掃除する。放置するとデプロイのたびに積み上がる。SnapStart を使う場合は
      # スナップショット保管料がバージョン数だけ課金されるため、影響が特に大きい。
      # 直近 KEEP 世代と live が指す版だけ残す。
      #
      # delete-function は --qualifier を付けたときだけ「そのバージョン」を消す。
      # 付け忘れると**関数ごと消える**ので、数値であることを必ず検証してから渡すこと。
      - name: Prune old versions
        env:
          KEEP: '3'
        run: |
          ALIAS_VERSION=$(aws lambda get-alias \
            --function-name "$FUNCTION_NAME" --name "$ALIAS_NAME" \
            --query FunctionVersion --output text)
          VERSIONS=$(aws lambda list-versions-by-function \
            --function-name "$FUNCTION_NAME" \
            --query 'Versions[?Version!=`$LATEST`].Version' --output text \
            | tr '\t' '\n' | sort -n)
          TOTAL=$(echo "$VERSIONS" | grep -c .)
          if [ "$TOTAL" -le "$KEEP" ]; then
            echo "versions=$TOTAL (keep=$KEEP) — 掃除不要"
            exit 0
          fi
          echo "$VERSIONS" | head -n "$((TOTAL - KEEP))" | while read -r v; do
            case "$v" in ''|*[!0-9]*) echo "skip: 不正な qualifier '$v'"; continue;; esac
            [ "$v" = "$ALIAS_VERSION" ] && { echo "skip: v$v は $ALIAS_NAME"; continue; }
            aws lambda delete-function \
              --function-name "$FUNCTION_NAME" --qualifier "$v" --no-cli-pager \
              && echo "deleted v$v"
          done

      # バッジは CloudFront に最大 1 時間キャッシュされる。デプロイ直後から新しい挙動を
      # 見せたいので、切り替えのたびに無効化する (月 1000 パスまで無料)。
      #
      # 未設定を if でスキップすると、ジョブは緑のまま旧バッジが最大 1 時間配信され続ける
      # 設定漏れに気づけない。設定されていなければ落とす。
      - name: Invalidate CloudFront
        run: |
          if [ -z "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            echo "::error::リポジトリ変数 CLOUDFRONT_DISTRIBUTION_ID が未設定です。terraform output cloudfront_distribution_id の値を設定してください。"
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*' \
            --no-cli-pager
